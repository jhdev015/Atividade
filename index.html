<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Atividade Bootstrap</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<style>
    footer {
  text-align: center;
}
</style>

<body>
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark"
    data-bs-theme="dark">

    <div class="container-fluid">

      <a class="navbar-brand" href="#">
        Minha Marca
      </a>

      <button class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation">

        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse"
        id="navbarSupportedContent">

        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          <li class="nav-item">
            <a class="nav-link active"
              aria-current="page"
              href="#">
              Home
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link"
              href="#">
              Serviços
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link disabled"
              aria-disabled="true">
              Contato
            </a>
          </li>

        </ul>

        <form class="d-flex" role="search">

          <input class="form-control me-2"
            type="search"
            placeholder="Pesquisar..."
            aria-label="Search" />

          <button class="btn btn-outline-success"
            type="submit">
            Buscar
          </button>

        </form>

      </div>
    </div>
  </nav>

  <div id="carouselExampleDark"
    class="carousel carousel-dark slide">

    <div class="carousel-inner">

      <div class="carousel-item active" data-bs-interval="10000">
<img src="https://cdn.pixabay.com/photo/2018/02/03/15/40/landscape-3127859_1280.jpg" class="d-block w-100" alt="Natureza 1" width="250px" height="650px">

        <div class="carousel-caption d-none d-md-block text-white">
          <h5>Primeiro Slide</h5>
        </div>

      </div>
      <div class="carousel-item" data-bs-interval="2000">

        <img src="https://cdn.pixabay.com/photo/2020/03/31/11/59/sunrise-4987384_1280.jpg" class="d-block w-100" alt="Natureza 2" width="250px" height="650px">

        <div class="carousel-caption d-none d-md-block text-white">
          <h5>Segundo Slide</h5>
        </div>

      </div>
      <div class="carousel-item">

        <img src="https://cdn.pixabay.com/photo/2020/02/11/10/24/lake-4839058_1280.jpg" class="d-block w-100" alt="Natureza 3" width="250px" height="650px">

        <div class="carousel-caption d-none d-md-block text-white">
          <h5>Terceiro Slide</h5>
 </div>
 </div>
 <button class="carousel-control-prev" type="button"
data-bs-target="#carouselExampleDark" data-bs-slide="prev">
 <span class="carousel-control-prev-icon"
aria-hidden="true"></span>
 <span class="visually-hidden">Anterior</span>
 </button>
 <button class="carousel-control-next" type="button"
data-bs-target="#carouselExampleDark" data-bs-slide="next">
 <span class="carousel-control-next-icon"
aria-hidden="true"></span>
 <span class="visually-hidden">Próximo</span>
 </button>
 </div>

 <div class="container text-center">
 <p class="mb-0">Meu Primeiro Site Carrosel &copy; 2026.</p>
 <small>Desenvolvido com dedicação.</small>
 </div>
 </footer>
 <script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bun
dle.min.js"></script>
</body>
</html>
